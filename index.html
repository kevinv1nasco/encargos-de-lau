<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="facebook-domain-verification" content="kr73eyjbszfpf6cfw9lokdc6gkiq62" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Encargos de Lau: sitio temporalmente fuera de servicio.">
  <title>Encargos de Lau — Temporalmente fuera de servicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0D1B8E;
      --red: #E8151B;
      --white: #FFFFFF;
      --text: #1A1A1A;
      --text-muted: #5C5C5C;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(13, 27, 142, 0.06) 0%, transparent 60%),
        linear-gradient(180deg, #F7F7F7 0%, var(--white) 100%);
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    .wrap {
      max-width: 420px;
    }

    .logo {
      height: 88px;
      width: auto;
      margin: 0 auto 2rem;
      display: block;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 0.875rem;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.15;
      color: var(--blue);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.0625rem;
      line-height: 1.65;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="logo.png" alt="Encargos de Lau" class="logo">
    <span class="eyebrow">Temporalmente cerrado</span>
    <h1>Estamos fuera de servicio</h1>
    <p>El sitio está temporalmente desactivado. Vuelve pronto.</p>
  </main>
</body>
</html>
